name: Appium Mobile Automation Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/appium/**'

concurrency:
  group: appium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appium:
    name: Appium Shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'tests/appium/requirements.txt'

      - name: Set up Node.js & Appium
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2 || true

      - name: Build Debug Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/appium/requirements.txt openpyxl

      - name: Validate Test Case YAML Definitions
        run: |
          python scripts/validate_test_cases.py

      - name: Run Appium Tests (Shard ${{ matrix.shard }}/2)
        env:
          ANDROID_APP_PATH: "app/build/outputs/apk/debug/app-debug.apk"
          ANDROID_DEVICE_NAME: "emulator-5554"
        run: |
          pytest tests/appium/test_cases/test_runner.py \
            -n auto \
            --shard=${{ matrix.shard }}/2 \
            --tb=short \
            --html=tests/appium/reports/report_shard_${{ matrix.shard }}.html \
            --junitxml=tests/appium/reports/junit_shard_${{ matrix.shard }}.xml || true

      - name: Generate Excel Test Reports
        if: always()
        run: |
          python scripts/generate_excel_reports.py

      - name: Upload Appium Test Reports & Excel Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-results-shard-${{ matrix.shard }}
          path: |
            tests/appium/reports/
            reports/
            app/build/outputs/apk/debug/
          retention-days: 7

      - name: Generate Step Summary
        if: always()
        run: |
          echo "# Appium Mobile Test Results (Shard ${{ matrix.shard }}/2)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Suite**: Appium Android Mobile Tests" >> $GITHUB_STEP_SUMMARY
          echo "**Shard**: ${{ matrix.shard }}/2" >> $GITHUB_STEP_SUMMARY
          echo "**Total Target Cases**: 300 (APP-001 -> APP-300)" >> $GITHUB_STEP_SUMMARY
          echo "**Excel Report**: \`tests/appium/reports/Appium_Test_Report.xlsx\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Detailed Excel (.xlsx) reports, Appium logs, device reports, and screenshots are available in job artifacts." >> $GITHUB_STEP_SUMMARY
