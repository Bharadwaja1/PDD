name: Selenium E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: selenium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selenium:
    name: Selenium Shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'tests/selenium/requirements.txt'

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/selenium/requirements.txt openpyxl

      - name: Validate Test Case YAML Definitions
        run: |
          python scripts/validate_test_cases.py

      - name: Run Selenium Tests (Shard ${{ matrix.shard }}/4)
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'http://localhost:8080' }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME || 'testuser@moodtunes.app' }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'TestPass123!' }}
          HEADLESS: "true"
        run: |
          pytest tests/selenium/test_cases/test_runner.py \
            -n auto \
            --shard=${{ matrix.shard }}/4 \
            --tb=short \
            --html=tests/selenium/reports/report_shard_${{ matrix.shard }}.html \
            --junitxml=tests/selenium/reports/junit_shard_${{ matrix.shard }}.xml || true

      - name: Generate Excel Test Reports
        if: always()
        run: |
          python scripts/generate_excel_reports.py

      - name: Upload Test Reports & Excel Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-results-shard-${{ matrix.shard }}
          path: |
            tests/selenium/reports/
            reports/
          retention-days: 7

      - name: Generate Step Summary
        if: always()
        run: |
          echo "# Selenium Test Results (Shard ${{ matrix.shard }}/4)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Suite**: Selenium E2E Tests" >> $GITHUB_STEP_SUMMARY
          echo "**Shard**: ${{ matrix.shard }}/4" >> $GITHUB_STEP_SUMMARY
          echo "**Total Target Cases**: 300 (SEL-001 -> SEL-300)" >> $GITHUB_STEP_SUMMARY
          echo "**Excel Report**: \`tests/selenium/reports/Selenium_Test_Report.xlsx\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Excel (.xlsx) reports, HTML/JUnit files, and screenshots are available in job artifacts." >> $GITHUB_STEP_SUMMARY
