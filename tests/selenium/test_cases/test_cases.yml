test_cases:
  # Authentication (SEL-001 to SEL-030)
  - id: SEL-001
    category: authentication
    name: Valid User Login
    description: Verify login with valid credentials opens the main dashboard
    priority: critical
    expected_result: Dashboard page is displayed with user avatar
  - id: SEL-002
    category: authentication
    name: Invalid Password Login
    description: Verify error message is shown when logging in with incorrect password
    priority: high
    expected_result: Error alert 'Login failed' is displayed
  - id: SEL-003
    category: authentication
    name: Non-Existent User Login
    description: Verify attempt to log in with unregistered email address
    priority: high
    expected_result: Appropriate authentication error is displayed
