    priority: high
    expected_result: Success confirmation toast or alert is displayed
  - id: SEL-011
    category: authentication
    name: Password Reset Blank Email
    description: Verify forgot password attempt without entering email address
    priority: low
    expected_result: Error message prompt to enter email address
  - id: SEL-012
    category: authentication
    name: Remember Me Checkbox Default
    description: Verify state of Remember Me option on login form
    priority: low
    expected_result: Checkbox is checked by default
