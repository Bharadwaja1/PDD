test_cases:
  # Authentication Security (SEC-001 to SEC-040)
  - id: SEC-001
    category: authentication_security
    name: Password Hash Algorithm Verification
    description: Verify Firebase Auth uses bcrypt or PBKDF2 strong password hashing
    priority: critical
    expected_result: Plaintext passwords never stored or logged
  - id: SEC-002
    category: authentication_security
    name: Brute Force Password Throttling
    description: Verify authentication blocks rapid repeated failed login attempts
    priority: critical
    expected_result: Account temporarily locked or throttled after 5 failed attempts
  - id: SEC-003
    category: authentication_security
    name: Credential Transmission TLS 1.3
    description: Verify login credentials sent strictly over HTTPS TLS 1.2 or 1.3
    priority: critical
    expected_result: Unencrypted HTTP credentials rejected
  - id: SEC-004
    category: authentication_security
    name: Auth Error Message Generic Response
    description: Verify login error does not distinguish between bad email vs bad password
    priority: high
    expected_result: Generic error 'Login failed' returned without user enumeration
  - id: SEC-005
    category: authentication_security
    name: Password Reset Token Expiration
    description: Verify password reset link token expires after standard duration
    priority: high
    expected_result: Expired reset tokens rejected
  - id: SEC-006
    category: authentication_security
    name: Password Reset Token One-Time Use
    description: Verify password reset link token cannot be re-used after invocation
    priority: high
    expected_result: Re-used reset token rejected
  - id: SEC-007
    category: authentication_security
    name: Spotify OAuth PKCE Code Verifier Randomness
    description: Verify Spotify PKCE code verifier uses SecureRandom with 64 bytes entropy
    priority: critical
    expected_result: Cryptographically secure high-entropy verifier generated
  - id: SEC-008
    category: authentication_security
    name: Spotify OAuth PKCE S256 Method
    description: Verify code_challenge uses SHA-256 (S256) instead of plain text
    priority: critical
    expected_result: S256 code_challenge_method enforced
  - id: SEC-009
    category: authentication_security
    name: Spotify OAuth State CSRF Protection
    description: Verify state parameter generated and validated on OAuth callback
    priority: critical
    expected_result: Mismatched state param rejects authorization callback
  - id: SEC-010
    category: authentication_security
    name: Client Secret Absence Verification
    description: Verify Spotify Client Secret is absent from APK, BuildConfig, and source
    priority: critical
    expected_result: Zero Client Secret strings in binary
  - id: SEC-011
    category: authentication_security
    name: Password Input Field Masking
    description: Verify password text fields mask input characters by default
    priority: medium
    expected_result: PasswordVisualTransformation applied
  - id: SEC-012
    category: authentication_security
    name: Password Field Copy Cut Prevention
    description: Verify password field context menu restricts copy operations
    priority: low
    expected_result: Copy menu action suppressed on password field
  - id: SEC-013
    category: authentication_security
    name: Password Minimum Entropy Requirement
    description: Verify password validation enforces minimum length of 8 characters
    priority: medium
    expected_result: Short passwords blocked
  - id: SEC-014
    category: authentication_security
    name: Login Form Auto-Complete Attribute
    description: Verify password field uses appropriate auto-complete attributes
    priority: low
    expected_result: Password autofill flags set
  - id: SEC-015
    category: authentication_security
    name: Account Registration Email Verification
    description: Verify registration process supports email verification check
    priority: medium
    expected_result: Email verification flag stored
  - id: SEC-016
    category: authentication_security
    name: Credential Leak Logcat Inspection
    description: Verify Android Logcat contains zero plaintext user credentials
    priority: critical
    expected_result: No passwords or private tokens printed in Logcat
  - id: SEC-017
    category: authentication_security
    name: Session Invalidation On Password Change
    description: Verify changing password revokes existing active session tokens
    priority: high
    expected_result: Old session tokens invalidated
  - id: SEC-018
    category: authentication_security
    name: Multi-Factor Auth Readines Check
    description: Verify auth architecture accommodates MFA step-up
    priority: low
    expected_result: MFA parameters handled if enabled
  - id: SEC-019
    category: authentication_security
    name: Remember Me Secure Storage
    description: Verify login state flags stored securely in EncryptedSharedPreferences
    priority: high
    expected_result: Private shared preferences restricted to app UID
  - id: SEC-020
    category: authentication_security
    name: Account Deletion Complete Data Purge
    description: Verify deleting user account purges user record and Firestore documents
    priority: high
    expected_result: User data deleted completely
  - id: SEC-021
    category: authentication_security
    name: Unauthenticated Access To User Profile
    description: Verify unauthenticated request to user profile API fails
    priority: critical
    expected_result: HTTP 401 Unauthorized
  - id: SEC-022
    category: authentication_security
    name: Unauthenticated Access To Mood History
    description: Verify unauthenticated request to mood history collection fails
    priority: critical
    expected_result: HTTP 401 Unauthorized
  - id: SEC-023
    category: authentication_security
    name: Unauthenticated Access To User Journal
    description: Verify unauthenticated request to journal entries fails
    priority: critical
    expected_result: HTTP 401 Unauthorized
  - id: SEC-024
    category: authentication_security
    name: Unauthenticated Access To User Playlists
    description: Verify unauthenticated request to private playlists fails
    priority: critical
    expected_result: HTTP 401 Unauthorized
  - id: SEC-025
    category: authentication_security
    name: OAuth Token Response Cache Control
    description: Verify token endpoint sets Cache-Control no-store header
    priority: high
    expected_result: Token responses uncached
  - id: SEC-026
    category: authentication_security
    name: Session Cookie HttpOnly Flag
    description: Verify authentication cookies set HttpOnly flag
    priority: high
    expected_result: HttpOnly attribute present
  - id: SEC-027
    category: authentication_security
    name: Session Cookie Secure Flag
    description: Verify authentication cookies set Secure flag
    priority: high
    expected_result: Secure attribute present
  - id: SEC-028
    category: authentication_security
    name: Session Cookie SameSite Attribute
    description: Verify authentication cookies set SameSite=Lax or Strict
    priority: high
    expected_result: SameSite attribute present
  - id: SEC-029
    category: authentication_security
    name: JWT Signature Algorithm Verification
    description: Verify JWT tokens signed using RS256 or HS256 algorithm
    priority: critical
    expected_result: Unsigned or 'none' algorithm JWTs rejected
  - id: SEC-030
    category: authentication_security
    name: JWT Expiration Claim Validation
    description: Verify server validates 'exp' claim in JWT tokens
    priority: critical
    expected_result: Expired JWTs rejected
  - id: SEC-031
    category: authentication_security
    name: JWT Audience Claim Validation
    description: Verify server validates 'aud' claim in JWT tokens
    priority: high
    expected_result: Invalid audience JWTs rejected
  - id: SEC-032
    category: authentication_security
    name: JWT Issuer Claim Validation
    description: Verify server validates 'iss' claim in JWT tokens
    priority: high
    expected_result: Invalid issuer JWTs rejected
  - id: SEC-033
    category: authentication_security
    name: OAuth Authorization Code Single Use
    description: Verify Spotify authorization code cannot be exchanged twice
    priority: high
    expected_result: Re-used authorization code returns invalid_grant
  - id: SEC-034
    category: authentication_security
    name: Redirect URI Manipulation Defense
    description: Verify OAuth token exchange validates redirect_uri exact match
    priority: critical
    expected_result: Mismatched redirect_uri rejected
  - id: SEC-035
    category: authentication_security
    name: Concurrent Login Sessions Behavior
    description: Verify concurrent logins from multiple devices handled securely
    priority: low
    expected_result: Sessions distinct or limited
  - id: SEC-036
    category: authentication_security
    name: Account Lockout Reset Duration
    description: Verify lockout window resets after designated timeout
    priority: medium
    expected_result: Lockout cleared after timeout
  - id: SEC-037
    category: authentication_security
    name: Password Reset User Enumeration Prevention
    description: Verify password reset request for non-existent email returns generic success
    priority: medium
    expected_result: Generic success message returned
  - id: SEC-038
    category: authentication_security
    name: Re-Authentication For Sensitive Actions
    description: Verify deleting account or changing email requires password confirmation
    priority: high
    expected_result: Re-authentication prompt displayed
  - id: SEC-039
    category: authentication_security
    name: Client Side Password History Prevention
    description: Verify password history not cached in mobile memory
    priority: low
    expected_result: Password variable cleared after use
  - id: SEC-040
    category: authentication_security
    name: Auth Failure Rate Alarm Trigger
    description: Verify security monitoring triggers alert on high login error rate
    priority: medium
    expected_result: Security audit log event created

  # Authorization & Access Control (SEC-041 to SEC-070)
  - id: SEC-041
    category: authorization_access_control
    name: Firestore Security Rules Document Ownership
    description: Verify Firestore security rules restrict user document read to owner UID
    priority: critical
    expected_result: Reading another user's document returns Permission Denied
  - id: SEC-042
    category: authorization_access_control
    name: Firestore Security Rules Write Ownership
    description: Verify Firestore security rules restrict user document write to owner UID
    priority: critical
    expected_result: Writing to another user's document returns Permission Denied
  - id: SEC-043
    category: authorization_access_control
    name: Private Playlist Access Restriction
    description: Verify user A cannot view private playlist belonging to user B
    priority: critical
    expected_result: Private playlist hidden or access denied
  - id: SEC-044
    category: authorization_access_control
    name: Mood History Access Restriction
    description: Verify user A cannot view mood history belonging to user B
    priority: critical
    expected_result: Access denied for non-owner
  - id: SEC-045
    category: authorization_access_control
    name: Mood Journal Access Restriction
    description: Verify user A cannot read journal entries belonging to user B
    priority: critical
    expected_result: Access denied for non-owner
  - id: SEC-046
    category: authorization_access_control
    name: IDOR Profile Modification Defense
    description: Verify attempting to edit profile with manipulated UID parameter fails
    priority: critical
    expected_result: Insecure Direct Object Reference blocked by server rules
  - id: SEC-047
    category: authorization_access_control
    name: IDOR Playlist Modification Defense
    description: Verify attempting to modify another user's playlist via API fails
    priority: critical
    expected_result: IDOR attempt blocked
  - id: SEC-048
    category: authorization_access_control
    name: Role-Based Access Control Admin Endpoints
    description: Verify standard user cannot invoke admin management endpoints
    priority: high
    expected_result: HTTP 403 Forbidden
  - id: SEC-049
    category: authorization_access_control
    name: Privilege Escalation Attempt Via Profile Update
    description: "Verify user cannot set role: admin in profile update payload"
    priority: critical
    expected_result: Role attribute filtered or restricted
  - id: SEC-050
    category: authorization_access_control
    name: Public Playlist Read Permission
    description: Verify public playlist is readable by authorized users
    priority: medium
    expected_result: Public playlist tracks returned
  - id: SEC-051
    category: authorization_access_control
    name: Public Playlist Write Permission Restriction
    description: Verify non-owner cannot modify tracks in public playlist
    priority: high
    expected_result: Non-owner write rejected
  - id: SEC-052
    category: authorization_access_control
    name: Firestore Rule Default Deny All
    description: Verify default Firestore rules fall back to deny all unmatched paths
    priority: critical
    expected_result: "Default match / { allow read, write: if false; } enforced"
  - id: SEC-053
    category: authorization_access_control
    name: API Endpoint HTTP Method Privilege Restriction
    description: Verify DELETE methods on catalog endpoints require elevated rights
    priority: high
    expected_result: HTTP 403 Forbidden
  - id: SEC-054
    category: authorization_access_control
    name: Audius API Key Scope Restriction
    description: Verify app_name query parameter uses read-only Audius access
    priority: medium
    expected_result: Read-only Audius queries executed
  - id: SEC-055
    category: authorization_access_control
    name: Spotify Token Minimum Scope Restriction
    description: Verify Spotify token requests only user-read-private and playback scopes
    priority: high
    expected_result: No write or playlist-modify permissions requested
  - id: SEC-056
    category: authorization_access_control
    name: Multi-Tenant Data Isolation Firestore
    description: Verify data strictly segregated under /users/{uid} hierarchy
    priority: critical
    expected_result: Multi-tenant boundary enforced
  - id: SEC-057
    category: authorization_access_control
    name: Horizontal Privilege Escalation Matrix
    description: Verify user A cannot perform actions on behalf of user B
    priority: critical
    expected_result: Cross-user actions rejected
  - id: SEC-058
    category: authorization_access_control
    name: Vertical Privilege Escalation Matrix
    description: Verify regular user cannot promote self to superuser
    priority: critical
    expected_result: Vertical escalation blocked
  - id: SEC-059
    category: authorization_access_control
    name: API Token Permission Scope Validation
    description: Verify backend checks scope claim before serving API resources
    priority: high
    expected_result: Insufficient scope returns HTTP 403
  - id: SEC-060
    category: authorization_access_control
    name: Revoked User Access Denial
    description: Verify disabled or deleted user account loses API access immediately
    priority: critical
    expected_result: Token validation fails for disabled user
  - id: SEC-061
    category: authorization_access_control
    name: Anonymous User Data Restriction
    description: Verify unauthenticated users cannot persist data to Firestore
    priority: high
    expected_result: Firestore write rejected for unauthenticated request
  - id: SEC-062
    category: authorization_access_control
    name: CORS Origin Authorization Check
    description: Verify sensitive APIs restrict origins to authorized domains
    priority: medium
    expected_result: Unauthorized Origin header rejected
  - id: SEC-063
    category: authorization_access_control
    name: User Data Export Auth Requirement
    description: Verify downloading personal data export requires active session
    priority: high
    expected_result: Export endpoint requires authentication
  - id: SEC-064
    category: authorization_access_control
    name: Session Hijacking Defense IP Validation
    description: Verify drastic IP/User-Agent shift flags security check
    priority: low
    expected_result: Anomaly flag triggered
  - id: SEC-065
    category: authorization_access_control
    name: Rate Limit Authorization Bypass Attempt
    description: Verify rotating headers does not bypass rate limiter
    priority: medium
    expected_result: Rate limit enforced on UID/IP
  - id: SEC-066
    category: authorization_access_control
    name: GraphQL Field Level Authorization
    description: Verify field level permissions if GraphQL endpoints used
    priority: low
    expected_result: Unauthorized fields omitted
  - id: SEC-067
    category: authorization_access_control
    name: Batch Request Partial Access Authorization
    description: Verify batch API request rejects unauthorized sub-items
    priority: medium
    expected_result: Partial error or authorization filtering
  - id: SEC-068
    category: authorization_access_control
    name: Webhook Endpoint Signature Verification
    description: Verify incoming webhooks validate secret HMAC signature
    priority: high
    expected_result: Unsigned webhooks rejected
  - id: SEC-069
    category: authorization_access_control
    name: Storage Bucket Rules User Isolation
    description: Verify Firebase Storage rules restrict user uploads to /users/{uid}/
    priority: high
    expected_result: Storage path permissions enforced
  - id: SEC-070
    category: authorization_access_control
    name: Access Control Policy Audit
    description: Verify automated static policy check passes
    priority: medium
    expected_result: Security rules pass audit

  # Session Management (SEC-071 to SEC-100)
  - id: SEC-071
    category: session_management
    name: Session Token Entropy 128-Bit
    description: Verify session tokens contain at least 128 bits of entropy
    priority: critical
    expected_result: High-entropy cryptographically secure token string
  - id: SEC-072
    category: session_management
    name: Session Expiration Timeout Enforcement
    description: Verify idle session expires after 30 days or designated duration
    priority: high
    expected_result: Expired session forces re-authentication
  - id: SEC-073
    category: session_management
    name: Logout Complete Token Revocation
    description: Verify tapping Log Out revokes local and remote refresh tokens
    priority: critical
    expected_result: Revoked refresh token rejected on subsequent use
  - id: SEC-074
    category: session_management
    name: SharedPreferences Encrypted Storage
    description: Verify tokens written to SharedPreferences use MODE_PRIVATE
    priority: critical
    expected_result: File permissions set to -rw------- (app user UID only)
  - id: SEC-075
    category: session_management
    name: In-Memory Token Handling
    description: Verify access tokens held in memory are cleared on logout
    priority: high
    expected_result: Memory reference set to null
  - id: SEC-076
    category: session_management
    name: Refresh Token Rotation
    description: Verify Spotify refresh token rotation returns new refresh token on use
    priority: medium
    expected_result: Old refresh token invalidated upon rotation
  - id: SEC-077
    category: session_management
    name: Session Fixation Defense On Login
    description: Verify new session ID generated upon authentication
    priority: high
    expected_result: Pre-login session ID discarded
  - id: SEC-078
    category: session_management
    name: Simultaneous Session Limit Check
    description: Verify maximum concurrent session count per user
    priority: low
    expected_result: Active session count bounded
  - id: SEC-079
    category: session_management
    name: Session Timeout Warning Trigger
    description: Verify prompt before session expiration if applicable
    priority: low
    expected_result: Expiration handled gracefully
  - id: SEC-080
    category: session_management
    name: Device Lock Session Security
    description: Verify app state lock on device screen lock if configured
    priority: low
    expected_result: State locked
  - id: SEC-081
    category: session_management
    name: Concurrent Token Refresh Throttling
    description: Verify multiple parallel requests trigger only 1 refresh call
    priority: medium
    expected_result: Single refresh request executed
  - id: SEC-082
    category: session_management
    name: Session Token Masking In Logs
    description: Verify token values masked as 'Bearer *****' in HTTP debug logs
    priority: critical
    expected_result: Tokens never printed in clear text in logs
  - id: SEC-083
    category: session_management
    name: Session Cookie Path Attribute
    description: Verify session cookie Path attribute restricted to /
    priority: low
    expected_result: Cookie Path=/
  - id: SEC-084
    category: session_management
    name: Session Cookie Domain Attribute
    description: Verify session cookie Domain attribute restricted to host
    priority: low
    expected_result: Cookie Domain exact match
  - id: SEC-085
    category: session_management
    name: Session Data Storage Android Auto-Backup Exclude
    description: Verify backup_rules.xml excludes auth tokens from cloud backup
    priority: high
    expected_result: spotify_auth_prefs.xml excluded from device backup
  - id: SEC-086
    category: session_management
    name: App Task Removal Session Security
    description: Verify background tasks pause media playback on task removal
    priority: medium
    expected_result: Playback service pauses on task removal
  - id: SEC-087
    category: session_management
    name: Spotify Token Expiration Auto-Refresh
    description: Verify background refresh triggered before token expires
    priority: high
    expected_result: Token refreshed automatically when expired
  - id: SEC-088
    category: session_management
    name: Invalid Refresh Token Fallback
    description: Verify invalid refresh token resets state to NotConnected
    priority: high
    expected_result: Auth state set to NotConnected and user prompted to log in
  - id: SEC-089
    category: session_management
    name: Multi-Threaded Session State Access
    description: Verify StateFlow/mutableStateOf session updates are thread-safe
    priority: medium
    expected_result: Thread-safe session updates
  - id: SEC-090
    category: session_management
    name: Memory Dump Token Protection
    description: Verify sensitive strings cleared when GC runs
    priority: low
    expected_result: Token references dereferenced
  - id: SEC-091
    category: session_management
    name: Cross-Site Scripting Session Theft Defense
    description: Verify local storage not accessible to third party scripts
    priority: critical
    expected_result: Storage scoped strictly to app package
  - id: SEC-092
    category: session_management
    name: Session Heartbeat Ping
    description: Verify periodic 10-second listening ping updates active session timestamp
    priority: low
    expected_result: Session timestamp updated
  - id: SEC-093
    category: session_management
    name: Session Idle Timeout Invalidation
    description: Verify inactive session invalidated
    priority: medium
    expected_result: Inactive session cleared
  - id: SEC-094
    category: session_management
    name: Auth Header Bearer Token Prefix Verification
    description: Verify Authorization header formatted as 'Bearer <token>'
    priority: high
    expected_result: Header correctly formatted
  - id: SEC-095
    category: session_management
    name: Session Termination On Account Lock
    description: Verify locked account terminates active sessions immediately
    priority: high
    expected_result: Sessions terminated
  - id: SEC-096
    category: session_management
    name: Session Replay Defense Timestamp
    description: Verify API requests include timestamp to prevent replay attacks
    priority: medium
    expected_result: Replayed requests outside timestamp window rejected
  - id: SEC-097
    category: session_management
    name: Session State Machine Consistency
    description: Verify state transitions (NotConnected -> Connecting -> Connected)
    priority: medium
    expected_result: Valid state transitions strictly enforced
  - id: SEC-098
    category: session_management
    name: Client Clock Skew Toleration
    description: Verify token expiry calculation tolerates 60s clock skew
    priority: low
    expected_result: Token refresh triggered smoothly despite clock skew
  - id: SEC-099
    category: session_management
    name: Session Audit Logging Event
    description: Verify login and logout events recorded in security audit log
    priority: low
    expected_result: Audit log entries created
  - id: SEC-100
    category: session_management
    name: Session Teardown On Uninstall
    description: Verify app uninstall removes token preferences
    priority: high
    expected_result: Token preferences deleted

  # Input Validation & Sanitization (SEC-101 to SEC-130)
  - id: SEC-101
    category: input_validation_sanitization
    name: HTML Tag Sanitization In User Display Name
    description: Verify HTML tags in user name input are encoded or stripped
    priority: critical
    expected_result: HTML tags rendered as plain text
  - id: SEC-102
    category: input_validation_sanitization
    name: Script Tag Sanitization In Journal Text
    description: Verify <script> tags in journal entry text are escaped
    priority: critical
    expected_result: Script tag rendered as literal text without execution
  - id: SEC-103
    category: input_validation_sanitization
    name: SQL Injection Payload In Search Field
    description: Verify SQL injection payload in search field processed safely
    priority: critical
    expected_result: Payload treated as plain search query string
  - id: SEC-104
    category: input_validation_sanitization
    name: Path Traversal String In Playlist Name
    description: Verify path traversal payload e.g. ../../etc/passwd handled safely
    priority: critical
    expected_result: Path traversal string sanitized and treated as plain text
  - id: SEC-105
    category: input_validation_sanitization
    name: Command Injection Payload In Form Inputs
    description: Verify shell command injection payload e.g. ; rm -rf / sanitized
    priority: critical
    expected_result: Command string treated as plain text
  - id: SEC-106
    category: input_validation_sanitization
    name: Null Byte Injection In File Upload Name
    description: Verify null byte character %00 in string inputs stripped
    priority: high
    expected_result: Null byte stripped or rejected
  - id: SEC-107
    category: input_validation_sanitization
    name: Extremely Long String Input Stress (10,000 Chars)
    description: Verify submitting 10,000 character string does not cause buffer overflow
    priority: high
    expected_result: String truncated or validated without application crash
  - id: SEC-108
    category: input_validation_sanitization
    name: Unicode Normalization Form C Validation
    description: Verify user text input normalized to Unicode NFC
    priority: medium
    expected_result: Canonical Unicode representation stored
  - id: SEC-109
    category: input_validation_sanitization
    name: Control Character Stripping
    description: Verify ASCII control characters 0x00-0x1F stripped from form inputs
    priority: medium
    expected_result: Control characters removed
  - id: SEC-110
    category: input_validation_sanitization
    name: Email Address Length Limit 254 Chars
    description: Verify email address input rejects strings exceeding 254 characters
    priority: medium
    expected_result: Validation error displayed for overlong email
  - id: SEC-111
    category: input_validation_sanitization
    name: URL Query Parameter Encoding
    description: Verify URI search query parameters URL encoded using Uri.encode
    priority: high
    expected_result: Special characters %20 %26 encoded cleanly
  - id: SEC-112
    category: input_validation_sanitization
    name: JSON Injection Defense In Store State
    description: Verify JSON string formatting escapes quotes and backslashes
    priority: high
    expected_result: Valid JSON generated without structure breaking
  - id: SEC-113
    category: input_validation_sanitization
    name: Numeric Input Bounds Check Duration
    description: Verify song duration numeric inputs bounded between 1 and 86400s
    priority: low
    expected_result: Out-of-bounds duration values rejected
  - id: SEC-114
    category: input_validation_sanitization
    name: Floating Point Volume Bounds Check
    description: Verify audio volume constrained strictly between 0.0f and 1.0f
    priority: medium
    expected_result: Volume clamped to [0.0, 1.0] range
  - id: SEC-115
    category: input_validation_sanitization
    name: Array Index Bounds Check Playlists
    description: Verify out-of-bounds playlist index access handled safely
    priority: high
    expected_result: IndexOutOfBoundsException prevented
  - id: SEC-116
    category: input_validation_sanitization
    name: Multi-Byte UTF-8 Emoji Input
    description: Verify 4-byte UTF-8 emoji strings stored and rendered cleanly
    priority: medium
    expected_result: Emojis preserved and rendered correctly
  - id: SEC-117
    category: input_validation_sanitization
    name: XML External Entity (XXE) Injection Defense
    description: Verify XML parser disables external entity resolution
    priority: critical
    expected_result: XXE payloads rejected
  - id: SEC-118
    category: input_validation_sanitization
    name: LDAP Injection Payload Defense
    description: Verify LDAP query injection payload handled safely
    priority: low
    expected_result: Plain text handling
  - id: SEC-119
    category: input_validation_sanitization
    name: Header Injection Defense In HTTP Requests
    description: Verify carriage return \r\n in header values stripped
    priority: critical
    expected_result: HTTP response splitting / header injection prevented
  - id: SEC-120
    category: input_validation_sanitization
    name: RegEx Denial of Service (ReDoS) Defense
    description: Verify search RegEx patterns avoid exponential backtracking
    priority: high
    expected_result: RegEx query completes in O(N) time
  - id: SEC-121
    category: input_validation_sanitization
    name: File Path Traversal Local Audio Loader
    description: Verify audio file loader validates cacheDir canonical path
    priority: critical
    expected_result: File loading restricted strictly to cacheDir
  - id: SEC-122
    category: input_validation_sanitization
    name: Integer Overflow Defense Track ID
    description: Verify large integer track IDs (> 2^31-1) parsed safely
    priority: medium
    expected_result: Large IDs parsed or rejected cleanly
  - id: SEC-123
    category: input_validation_sanitization
    name: Form Input Trim Functionality
    description: Verify trim() applied to user name and playlist titles
    priority: low
