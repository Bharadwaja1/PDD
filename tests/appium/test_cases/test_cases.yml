test_cases:
  # Mobile App Lifecycle (APP-001 to APP-030)
  - id: APP-001
    category: mobile_app_lifecycle
    name: Fresh App Installation
    description: Verify initial APK installation on Android device
    priority: critical
    expected_result: Package com.moodtunes.app installed successfully
  - id: APP-002
    category: mobile_app_lifecycle
    name: App Cold Launch
    description: Verify launching application from fresh process state
    priority: critical
    expected_result: MainActivity launches and displays Splash screen
  - id: APP-003
    category: mobile_app_lifecycle
    name: App Warm Launch
    description: Verify launching application from cached memory state
    priority: high
    expected_result: App restores active screen instantly
  - id: APP-004
    category: mobile_app_lifecycle
    name: App Background and Resume
    description: Verify sending app to background and returning to foreground
    priority: critical
    expected_result: App state and current screen route preserved
  - id: APP-005
    category: mobile_app_lifecycle
    name: Process Termination Recovery
    description: Verify app recovery after Android OS process kill
    priority: high
    expected_result: Saved SharedPreferences restored on launch
  - id: APP-006
    category: mobile_app_lifecycle
    name: App Upgrade Migration
    description: Verify database and prefs migration on app update
    priority: medium
    expected_result: Existing user data preserved after upgrade
  - id: APP-007
    category: mobile_app_lifecycle
    name: App Uninstall Cleanup
    description: Verify removing app removes app private data directory
    priority: low
    expected_result: App uninstalled completely
  - id: APP-008
    category: mobile_app_lifecycle
    name: Device Screen Timeout Handling
    description: Verify app behavior when screen dims and unlocks
    priority: medium
    expected_result: Screen unlocks back to current app activity
  - id: APP-009
    category: mobile_app_lifecycle
    name: Memory Pressure Handling
    description: Verify app behavior under low system memory trim warning
    priority: medium
    expected_result: Non-essential image caches freed without crash
  - id: APP-010
    category: mobile_app_lifecycle
    name: Orientation Change Portrait
    description: Verify app layout in portrait orientation
    priority: high
    expected_result: Content laid out vertically
  - id: APP-011
    category: mobile_app_lifecycle
    name: Orientation Change Landscape
    description: Verify app layout adapts in landscape orientation
    priority: medium
    expected_result: Layout adjusts to landscape dimensions
  - id: APP-012
    category: mobile_app_lifecycle
    name: Rapid Orientation Switch
    description: Verify toggling orientation repeatedly does not cause crash
    priority: low
    expected_result: Activity handles configuration changes
  - id: APP-013
    category: mobile_app_lifecycle
    name: Hardware Back Button App Minimization
    description: Verify pressing back button on root screen sends app to background
    priority: medium
    expected_result: App backgrounded cleanly
  - id: APP-014
    category: mobile_app_lifecycle
    name: Deep Link Intent Activation
