    category: mobile_app_lifecycle
    name: Media3 Service Destruction
    description: Verify PlaybackService stops when playback is paused and task removed
    priority: medium
    expected_result: Service stops and notification dismissed
  - id: APP-017
    category: mobile_app_lifecycle
