    priority: critical
    expected_result: MainActivity handles deep link intent
  - id: APP-015
    category: mobile_app_lifecycle
    name: Media3 Foreground Service Lifecycle
    description: Verify PlaybackService survives activity destruction
    priority: critical
    expected_result: Audio playback service continues in foreground
